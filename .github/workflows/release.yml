name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) to build the
# PCM package and publish it as a GitHub release asset. The asset URL is
# the stable `download_url` used in the KiCad addon-metadata submission
# (see pcm-submission/README.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build PCM package
        run: python packaging/build_pcm.py
      - name: Publish release with the zip asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
